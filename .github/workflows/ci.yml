name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Fails below 80% line/branch/function/statement coverage (see vitest.config.mts).
      - run: npm run test:coverage

  e2e:
    name: Build & end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the image and waits for its HEALTHCHECK to pass.
      - name: Build and start the container
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Smoke-test the container
        run: bash scripts/docker-smoke.sh http://localhost:3000
      - name: Show container logs
        if: failure()
        run: docker compose logs
      - name: Stop the container
        if: always()
        run: docker compose down

  commits:
    name: Conventional commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action lists the PR's commits through the API (needed on private repos).
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
