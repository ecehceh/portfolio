version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all dev tooling instead of one per package.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Pinned to r149 on purpose: newer releases change the lighting model.
      # Upgrade in a dedicated PR that retunes the lights.
      - dependency-name: three
      - dependency-name: '@types/three'
      # typescript-eslint supports TypeScript < 6.1 only; bump TS by hand once it catches up.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Keep the Node types on the runtime's major (Node 22, see engines and CI).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
