version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all dev tooling instead of one per package.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Pinned to r149 on purpose: newer releases change the lighting model.
      # Upgrade in a dedicated PR that retunes the lights.
      - dependency-name: three
      - dependency-name: '@types/three'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
